<style>
*{box-sizing:border-box;margin:0}
body{font:16px system-ui,sans-serif;background:#F1F5F9;color:#0F172A;padding-bottom:90px}

.hero .b{max-width:320px;background:#fff;color:#1D4ED8}

header small{color:#BFDBFE}
.pad{padding:16px}h1{font-size:22px}h2{margin:12px 0}

.card.late{border-left:5px solid #DC2626}
.row{display:flex;justify-content:space-between;gap:8px}
.red{color:#DC2626}.ok{color:#16A34A}
.bar{height:10px;background:#E2E8F0;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#1D4ED8}
small{color:#64748B;display:block}
em{color:#DC2626;font-style:normal;font-size:14px;font-weight:600}
.mut{color:#64748B;text-align:center;margin-top:40px}
.l{background:none;border:0;color:inherit;font-size:18px;padding:4px 8px}
.pad .l{color:#1D4ED8}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:16px;right:16px;padding:16px;border:0;border-radius:30px;background:#1D4ED8;color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid #CBD5E1;background:#fff;font-size:15px;color:#0F172A}.chip.on{background:#1D4ED8;color:#fff;border-color:#1D4ED8}
.th{width:56px;height:56px;object-fit:cover;border-radius:10px}

</style></head><body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const CFG={apiKey:"AIzaSyCZrn0nwc-CIMyCk2mImEp_-clCDdhLWXU",authDomain:"paylittle-26960.firebaseapp.com",projectId:"paylittle-26960",storageBucket:"paylittle-26960.firebasestorage.app",messagingSenderId:"162181949410",appId:"1:162181949410:web:8ab7718562016d47e7fbbb"};
const PAYS=[["🇨🇮","Côte d'Ivoire"],["🇬🇭","Ghana"],["🇲🇱","Mali"],["🇧🇫","Burkina Faso"],["🇳🇪","Niger"],["🇲🇦","Maroc"],["🇸🇳","Sénégal"],["🇲🇷","Mauritanie"]];
const PAYSEL=PAYS.map(p=>`<option value="${p[1]}">${p[0]} ${p[1]}</option>`).join('');
const CATS=["Téléphone","Électroménager","Mobilier","Santé","Autre"];
firebase.initializeApp(CFG);
const db=firebase.firestore(),auth=firebase.auth();
let V=null;
const cid=p=>V.phone+'_'+p,MAIL=p=>'v.'+p+'@paylittle.app',PW=c=>'PL'+c;
function authErr(e){const k=(e&&e.code)||'';if(k=='auth/operation-not-allowed')return'Activez « E-mail/Mot de passe » dans Firebase Authentication.';if(k=='auth/too-many-requests')return'Trop d\'essais. Réessayez dans quelques minutes.';if(k=='auth/network-request-failed')return'Pas de connexion internet.';if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(k))return'Numéro ou code incorrect.';if(k=='auth/email-already-in-use')return'Ce numéro a déjà un compte vendeur. Utilisez « Connexion ».';return'Erreur : '+(k||'réessayez')}
const store={
 async vendor(p){const d=await db.collection('vendors').doc(p).get();return d.exists?d.data():null},
 async setVendor(v){await db.collection('vendors').doc(v.phone).set(v)},
 async cust(p){const d=await db.collection('customers').doc(p).get();return d.exists?d.data():null},
 async setPcs(ph,o){await db.collection('pieces').doc(cid(ph)).set(o)},
 async getPcs(ph){const d=await db.collection('pieces').doc(cid(ph)).get();return d.exists?d.data():null},
 async arts(){const s=await db.collection('articles').where('vp','==',V.phone).get();return s.docs.map(d=>d.data())},
 async addArt(a){a.vp=V.phone;await db.collection('articles').doc(V.phone+'_'+a.id).set(a)},
 async delArt(id){await db.collection('articles').doc(V.phone+'_'+id).delete()},
 async del(p){await db.collection('clients').doc(cid(p)).delete();await db.collection('pieces').doc(cid(p)).delete()},
 async all(){const s=await db.collection('clients').where('vp','==',V.phone).get();return s.docs.map(d=>d.data())},
 async get(p){const d=await db.collection('clients').doc(cid(p)).get();return d.exists?d.data():null},
 async save(c){c.vp=V.phone;await db.collection('clients').doc(cid(c.phone)).set(c)}
};
function rnd6(){const a=new Uint32Array(1);crypto.getRandomValues(a);return String(100000+a[0]%900000)}
async function ensureCust(ph,reset){const old=await store.cust(ph);if(old&&!reset)return'';
const sec=firebase.apps.find(a=>a.name=='sec')||firebase.initializeApp(CFG,'sec'),sa=sec.auth(),tmp=rnd6();let n=old?old.n+1:0,uid=null;
for(let k=0;k<6&&!uid;k++,n++){try{uid=(await sa.createUserWithEmailAndPassword('c'+n+'.'+ph+'@paylittle.app',PW(tmp))).user.uid}catch(e){if(!e||e.code!='auth/email-already-in-use')throw e}}
await sa.signOut();if(!uid)throw new Error('x');
await db.collection('customers').doc(ph).set({phone:ph,n:n-1,uid,tmp:true});return tmp}
const $=s=>document.querySelector(s),app=$('#app');
const fmt=n=>Number(n).toLocaleString('fr-FR')+' F';
const num=s=>s.replace(/\D/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const dfr=d=>d.split('-').reverse().join('/');
const paid=cr=>cr.acompte+cr.versements.reduce((s,v)=>s+v.montant,0);
const LIB={j:'jour',s:'semaine',m:'mois'},STEP={j:1,s:7,m:30};
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const nextDue=cr=>{if(!cr.plan)return cr.echeance;const k=Math.min(Math.floor((paid(cr)-cr.acompte)/cr.plan.montant)+1,cr.plan.n);return addDays(cr.date,k*STEP[cr.plan.freq])};
const late=cr=>cr.prix-paid(cr)>0&&nextDue(cr)&&nextDue(cr)<today();
const dueNow=cr=>{if(!cr.plan)return cr.echeance&&cr.echeance<today()?Math.max(0,cr.prix-paid(cr)):0;const d=Math.floor((Date.parse(today())-Date.parse(cr.date))/864e5),k=Math.min(Math.max(Math.floor(d/STEP[cr.plan.freq]),0),cr.plan.n);return Math.max(0,Math.min(cr.prix,cr.acompte+k*cr.plan.montant)-paid(cr))};
const owed=c=>c.credits.reduce((s,x)=>s+x.prix-paid(x),0);
let S={sel:null,client:null};
const sched=cr=>{const L=[],p=cr.plan,base=cr.prix-cr.acompte;if(!p||base<=0)return L;let cum=0;for(let k=1;k<=p.n&&cum<base;k++){const m=Math.min(p.montant,base-cum);cum+=m;L.push({k,date:addDays(cr.date,k*STEP[p.freq]),montant:m,cum})}return L};
const schedHtml=(cr,i,v)=>{const L=sched(cr);if(!L.length)return'';const pd=paid(cr)-cr.acompte;let nxt=true;return `<details open><summary>Échéancier (${L.length} versements)</summary>${L.map(e=>{const ok=pd>=e.cum,isNext=!ok&&nxt;if(!ok)nxt=false;const lt=!ok&&e.date<today();return `<div class="row" style="align-items:center;padding:6px 0;border-bottom:1px solid #E2E8F0"><span>${v?`<input type="checkbox" style="width:auto;margin:0 8px 0 0" ${ok?'checked disabled':isNext?'':'disabled'} onchange="tick(${i},${e.k})">`:(ok?'✅ ':'⏳ ')}${dfr(e.date)}</span><b class="${ok?'ok':lt?'red':''}">${fmt(e.montant)}${ok?' payé':lt?' en retard':''}</b></div>`}).join('')}</details>`};


function logo(s){return `<svg width="${s}" height="${s}" viewBox="0 0 160 160" role="img" aria-label="PayLittle"><rect width="160" height="160" rx="36" fill="#fff"/><path d="M0 116h160v8a36 36 0 0 1-36 36H36a36 36 0 0 1-36-36z" fill="#1D4ED8"/><circle cx="80" cy="58" r="38" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="6"/><path d="M80 58V20a38 38 0 0 1 38 38z" fill="#1D4ED8"/><path d="M80 58h38a38 38 0 0 1-38 38z" fill="#60A5FA"/><text x="80" y="147" text-anchor="middle" font-size="19" font-weight="600" fill="#fff" font-family="system-ui,sans-serif">PayLittle</text></svg>`}

let MODE='in';
function login(m){if(m)MODE=m;const up=MODE=='up',W='style="max-width:320px"';app.innerHTML=`<div class="hero">${logo(110)}<p>Espace vendeur</p><div class="row" style="width:100%;max-width:320px"><button class="b ${up?'o':''}" onclick="login('in')">Connexion</button><button class="b ${up?'':'o'}" onclick="login('up')">Créer mon compte</button></div>${up?`<input id="vn" placeholder="Votre nom ou nom de la boutique" ${W}>`:''}<input id="vp" type="tel" placeholder="Votre numéro de téléphone" ${W}><input id="vc" type="password" inputmode="numeric" placeholder="${up?'Créez votre code secret (4 à 6 chiffres)':'Votre code secret'}" ${W}>${up?`<input id="vc2" type="password" inputmode="numeric" placeholder="Retapez votre code secret" ${W}><input id="vw" type="tel" placeholder="Numéro Wave / Orange Money pour recevoir les paiements (si différent)" ${W}>`:''}<button class="b" onclick="${up?'signUp()':'signIn()'}">${up?'Créer mon compte vendeur':'Entrer'}</button></div>`}
const okCode=c=>/^\d{4,6}$/.test(c);
async function signUp(){const n=$('#vn').value.trim(),p=num($('#vp').value),c=$('#vc').value.trim(),w=$('#vw').value.trim()||$('#vp').value.trim();
if(!n||p.length<8)return alert('Entrez votre nom et votre numéro de téléphone.');
if(!okCode(c))return alert('Le code secret doit avoir 4 à 6 chiffres.');
if(c!==$('#vc2').value.trim())return alert('Les deux codes ne sont pas identiques.');
try{await auth.createUserWithEmailAndPassword(MAIL(p),PW(c));const v={nom:n,phone:p,pay:num(w),payFmt:w};await store.setVendor(v);V=v;home()}catch(e){alert(authErr(e))}}
async function signIn(){const p=num($('#vp').value),c=$('#vc').value.trim();
try{await auth.signInWithEmailAndPassword(MAIL(p),PW(c));const v=await store.vendor(p);if(!v){await auth.signOut();return alert('Compte incomplet. Créez-le à nouveau avec un autre numéro ou contactez le support.')}V=v;home()}catch(e){alert(authErr(e))}}
function logout(){V=null;S={sel:null,client:null};auth.signOut().catch(()=>{});login('in')}
function auto(){auth.onAuthStateChanged(async u=>{if(u&&/^v\./.test(u.email||'')){try{const v=await store.vendor(u.email.split('@')[0].slice(2));if(v&&!V){V=v;home()}}catch(e){}}else if(!V)login('in')})}

function cardCr(cr,i,v){const p=paid(cr),l=cr.prix-p,pc=Math.min(100,Math.round(p/cr.prix*100));
return `<div class="card ${late(cr)?'late':''}"><div class="row"><b>${esc(cr.article)}</b><b>${fmt(cr.prix)}</b></div>${cr.interet?`<small>Article ${fmt(cr.base)} + intérêts ${fmt(cr.interet)}</small>`:''}${cr.cat?`<small>${esc(cr.cat)}</small>`:''}<div class="bar"><i style="width:${pc}%"></i></div><div class="row"><span>Payé ${fmt(p)}</span><b class="${l>0?'red':'ok'}">${l>0?'Reste '+fmt(l):'Soldé'}</b></div>${l>0&&cr.plan?`<small>À payer : ${fmt(cr.plan.montant)} par ${LIB[cr.plan.freq]}. Prochain versement avant le ${dfr(nextDue(cr))}.</small>`:''}${cr.echeance&&l>0?`<small>Date limite : ${dfr(cr.echeance)}</small>`:''}${dueNow(cr)>0&&l>0?`<em>${late(cr)?'En retard : ':'À payer maintenant : '}${fmt(dueNow(cr))}</em>`:''}${schedHtml(cr,i,v)}<details><summary>Historique (${cr.versements.length+1})</summary><small>${dfr(cr.date)} : acompte ${fmt(cr.acompte)}</small>${cr.versements.map(x=>`<small>${dfr(x.date)} : ${fmt(x.montant)}</small>`).join('')}</details>${v&&l>0?`<button class="b s" onclick="pay(${i})">Ajouter un versement</button>`:''}</div>`}

let F='Tous';
function setF(f){F=f;home()}
async function home(){const ow=c=>c.credits.filter(x=>F=='Tous'||x.cat==F).reduce((s,x)=>s+x.prix-paid(x),0);
const all=await store.all(),E=all.filter(c=>echu(c)>0),L=all.filter(c=>F=='Tous'||c.credits.some(x=>x.cat==F)).sort((a,b)=>ow(b)-ow(a));
app.innerHTML=`<header><div><b style="font-size:20px">PayLittle</b><small>${esc(V.nom)}</small></div><div style="text-align:right"><small>Total dû</small><h1>${fmt(L.reduce((s,c)=>s+ow(c),0))}</h1></div></header><div class="pad"><small style="margin-bottom:8px">Numéro de paiement : <b>${esc(V.payFmt)}</b> (Wave / Orange Money)</small><div class="chips">${['Tous',...CATS].map(k=>`<button class="chip ${k==F?'on':''}" onclick="setF('${k}')">${k}</button>`).join('')}</div>${E.length?`<div class="card late" onclick="rappels()"><div class="row"><b>${E.length} client${E.length>1?'s':''} à relancer</b><b class="red">${fmt(E.reduce((s,c)=>s+echu(c),0))}</b></div><small>Appuyez pour envoyer les rappels</small></div>`:''}${L.length?L.map(c=>`<div class="card" onclick="open_('${c.phone}')"><div class="row"><b>${esc(c.nom)}</b><b class="${ow(c)?'red':'ok'}">${ow(c)?fmt(ow(c)):'Soldé'}</b></div><small>${c.phone}</small>${c.credits.some(late)?'<em>En retard</em>':''}</div>`).join(''):'<p class="mut">Aucun crédit ici pour l\'instant. Appuyez sur « Nouveau crédit ».</p>'}<button class="b o" onclick="arts()">Mes articles</button><button class="b o" onclick="logout()">Quitter</button></div><button class="fab" onclick="newCr()">Nouveau crédit</button>`}

function voir(u){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9';d.innerHTML='<img src="'+u+'" style="max-width:100%;max-height:100%">';d.onclick=()=>d.remove();document.body.appendChild(d)}

async function open_(p){const c=S.sel=await store.get(p),pc=await store.getPcs(p),PH=pc?`<div class="card"><b>Pièces du client</b><div class="row">${[['photo','Photo'],['recto','Recto'],['verso','Verso'],['maison','Maison']].map(([k,l])=>pc[k]?`<div><img src="${pc[k]}" class="pc" onclick="voir(this.src)" alt="${l}"><small>${l}</small></div>`:'').join('')}</div></div>`:'';app.innerHTML=`<header><button class="l" onclick="home()">‹</button><div style="flex:1"><h1>${esc(c.nom)}</h1><small>${c.phone}</small></div></header><div class="pad">${PH}${infoHtml(c)}${locHtml(c)}${c.credits.map((x,i)=>cardCr(x,i,true)).join('')}<button class="b o" onclick="wa()">Envoyer un rappel WhatsApp</button><button class="b" onclick="newCr('${c.phone}')">Nouvel article à crédit</button><button class="b o" onclick="resetCode('${c.phone}')">Nouveau code provisoire (code oublié)</button><button class="b o" style="color:#DC2626;border-color:#DC2626" onclick="delClient('${c.phone}')">Supprimer ce client</button></div>`}

async function tick(i,k){const c=S.sel,cr=c.credits[i],e=sched(cr).find(x=>x.k==k),need=e.cum-(paid(cr)-cr.acompte);if(need>0){cr.versements.push({montant:need,date:today()});await store.save(c)}open_(c.phone)}
function locHtml(c){const l=c.loc;return `<div class="card"><b>Position du client</b>${l?`<small>Dernière position : ${dfr(l.date.slice(0,10))} à ${l.date.slice(11,16)} (précision ${l.prec} m)</small><a class="b s" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${l.lat},${l.lng}">Voir sur la carte</a>`:'<small>Le client n\'a pas encore partagé sa position.</small>'}</div>`}
function infoHtml(c){const i=c.info;if(!i)return'';const g=i.garant||{};return `<div class="card"><b>Renseignements</b>${[['Sexe',i.sexe],['Domicile',i.domicile],['Repère',i.repere],['Profession',i.profession],['Pays de la pièce',i.pays],['Pièce n°',i.piece]].filter(x=>x[1]).map(x=>`<div class="row"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}<b style="margin-top:6px">Garant</b><div class="row"><span>${esc(g.nom||'')}${g.lien?' ('+esc(g.lien)+')':''}</span><b>${esc(g.tel||'')}</b></div>${g.tel?`<div class="row"><a class="b s" style="text-align:center;text-decoration:none" href="tel:+${nn(g.tel)}">Appeler</a><a class="b s" style="text-align:center;text-decoration:none" href="https://wa.me/${nn(g.tel)}">WhatsApp</a></div>`:''}</div>`}
async function resetCode(p){if(!confirm('Générer un nouveau code provisoire ? L\'ancien code du client ne marchera plus.'))return;try{const tmp=await ensureCust(p,true);alert('Nouveau code provisoire : '+tmp+'\nDonnez-le au client : il créera un nouveau code personnel à sa connexion.')}catch(e){alert('Échec. Réessayez.')}}
async function delClient(p){const c=S.sel;if(!confirm('Supprimer '+c.nom+' ?'+(owed(c)>0?' Il reste '+fmt(owed(c))+' à payer.':'')+' Cette action est définitive.'))return;if(!confirm('Confirmer la suppression définitive de '+c.nom+' ?'))return;await store.del(p);S.sel=null;home()}
async function pay(i){const cp=S.sel.credits[i],m=+prompt('Montant versé (F)',cp.plan?cp.plan.montant:'');if(!(m>0))return;const c=S.sel;c.credits[i].versements.push({montant:m,date:today()});await store.save(c);open_(c.phone)}

function wa(){const c=S.sel;let n=c.phone;if(n.length==10)n='225'+n;open('https://wa.me/'+n+'?text='+encodeURIComponent(`Bonjour ${c.nom}, il vous reste ${fmt(owed(c))} à payer pour vos articles. Merci de payer par Wave ou Orange Money au ${V.payFmt} ou de passer faire un versement. PayLittle`))}

const ACOMPTE=30;
const INT=p=>p>0?(p<=20000?5000:10000):0;
const sugg=pr=>Math.ceil(pr*ACOMPTE/100/500)*500;
let ARTS=[];
async function newCr(p=''){ARTS=await store.arts();const c=p&&S.sel;app.innerHTML=`<div class="pad"><button class="l" onclick="${p?`open_('${p}')`:'home()'}">‹ Retour</button><h2>Nouveau crédit</h2><input id="n" placeholder="Nom du client" value="${c?esc(c.nom):''}"><input id="t" type="tel" placeholder="Téléphone du client" value="${p}" ${p?'readonly':''}>${p?'':'<label>Photo du client (obligatoire pour un nouveau client)</label><input id="fph" type="file" accept="image/*" capture="user"><label>Pièce d\'identité, recto</label><input id="frc" type="file" accept="image/*" capture="environment"><label>Pièce d\'identité, verso</label><input id="fvs" type="file" accept="image/*" capture="environment"><label>Photo de la maison (facultatif)</label><input id="fmz" type="file" accept="image/*" capture="environment"><label>Renseignements du client</label><select id="sx"><option>Homme</option><option>Femme</option></select><input id="dm" placeholder="Domicile (quartier, commune)"><input id="rp" placeholder="Point de repère du domicile"><input id="pf" placeholder="Profession / lieu de travail"><label>Pays de la pièce d\'identité</label><select id="pa">'+PAYSEL+'</select><input id="ni" placeholder="Numéro de la pièce d\'identité"><label>Garant (obligatoire)</label><input id="gn" placeholder="Nom du garant"><input id="gt" type="tel" placeholder="Numéro du garant"><input id="gl" placeholder="Lien avec le garant (ex. frère, ami)">'}<label>Catégorie</label><select id="cat">${CATS.map(k=>`<option>${k}</option>`).join('')}</select><select id="pick" onchange="pickArt()"><option value="">Choisir dans mes articles</option>${ARTS.map((a,i)=>`<option value="${i}">${esc(a.nom)} - ${fmt(a.prix)}</option>`).join('')}</select><input id="a" placeholder="Article (ex. Tecno Pop 10)"><input id="pr" type="number" inputmode="numeric" placeholder="Prix de l'article (F)" oninput="calc('pr')"><label>Premier versement (conseillé : ${ACOMPTE} % du prix)</label><input id="ac" type="number" inputmode="numeric" placeholder="Premier versement (F)" oninput="calc()"><label>Durée</label><select id="du" onchange="calc()"><option value="1">1 mois</option><option value="2">2 mois</option><option value="3" selected>3 mois</option><option value="4">4 mois</option></select><label>Le client paie</label><select id="fr" onchange="calc()"><option value="j">Chaque jour</option><option value="s" selected>Chaque semaine</option><option value="m">Chaque mois</option></select><div class="card" id="res"></div><button class="b" onclick="saveCr()">Enregistrer le crédit</button></div>`}

function planOf(pr,ac,du,fr){const reste=pr-ac,n=fr=='m'?du:fr=='s'?Math.ceil(du*30/7):du*30;return{n,reste,montant:Math.ceil(reste/n/25)*25}}

function calc(src){const b=+$('#pr').value||0,pr=b+INT(b);if(src=='pr'||src=='pick')$('#ac').value=pr?sugg(pr):'';const ac=+$('#ac').value||0,r=$('#res');if(!(b>0)||ac>=pr){r.innerHTML='';return}const du=+$('#du').value,fr=$('#fr').value,P=planOf(pr,ac,du,fr);r.innerHTML=`<div class="row"><span>Intérêts</span><b>${fmt(INT(b))}</b></div><div class="row"><span>Total à payer</span><b>${fmt(pr)}</b></div><div class="row"><span>Reste à payer</span><b>${fmt(P.reste)}</b></div><div class="row"><span>Chaque ${LIB[fr]}</span><b>${fmt(P.montant)}</b></div><small>${P.n} versements. Fin le ${dfr(addDays(today(),du*30))}.</small>`}

function pickArt(){const a=ARTS[$('#pick').value];if(!a)return;$('#a').value=a.nom;$('#pr').value=a.prix;$('#cat').value=a.cat;calc('pick')}

async function saveCr(){const g=i=>$('#'+i).value.trim(),ph=num(g('t')),b=+g('pr'),pr=b+INT(b),ac=+g('ac')||0;
if(!g('n')||ph.length<8||!g('a')||!(b>0)||ac>pr)return alert('Vérifiez le nom, le téléphone, l\'article, le prix et le premier versement.');
const old=await store.get(ph),F=['fph','frc','fvs','fmz'].map(i=>$('#'+i)&&$('#'+i).files[0]);
if(!old&&F.slice(0,3).some(x=>!x))return alert('Prenez la photo du client et sa pièce d\'identité, recto et verso.');
if(!old&&(!g('dm')||!g('gn')||num(g('gt')).length<8))return alert('Entrez le domicile du client, le nom et le numéro du garant.');
if(F.some(x=>x)){try{const o=await store.getPcs(ph)||{};const R=await Promise.all(F.map((x,i)=>x?shrink(x,i?1000:500,.65):''));await store.setPcs(ph,{photo:R[0]||o.photo||'',recto:R[1]||o.recto||'',verso:R[2]||o.verso||'',maison:R[3]||o.maison||''})}catch(e){return alert('Les photos n\'ont pas pu être enregistrées. Réessayez.')}}
const c=old||{nom:g('n'),phone:ph,credits:[],info:{sexe:g('sx'),domicile:g('dm'),repere:g('rp'),profession:g('pf'),pays:g('pa'),piece:g('ni'),garant:{nom:g('gn'),tel:num(g('gt')),lien:g('gl')}}};
const du=+g('du'),fr=g('fr'),cr={article:g('a'),cat:g('cat'),prix:pr,base:b,interet:INT(b),acompte:ac,date:today(),echeance:'',versements:[]};
if(ac<pr){const P=planOf(pr,ac,du,fr);cr.plan={freq:fr,n:P.n,montant:P.montant};cr.echeance=addDays(cr.date,du*30)}
c.credits.push(cr);await store.save(c);S.sel=c;let tmp;try{tmp=await ensureCust(ph)}catch(e){tmp=null}
alert(tmp?'Crédit enregistré.\nCode provisoire du client : '+tmp+'\nDonnez-le au client (numéro '+ph+') : il créera son code personnel à sa première connexion.':tmp===''?'Crédit enregistré.':'Crédit enregistré, mais le compte du client n\'a pas pu être créé. Ouvrez sa fiche et appuyez sur « Nouveau code provisoire ».');open_(ph)}

const nn=ph=>ph.length==10?'225'+ph:ph;
const echu=c=>c.credits.reduce((s,x)=>s+dueNow(x),0);
const txt=c=>`Bonjour ${c.nom}, votre versement de ${fmt(echu(c))} est arrivé à échéance. Il vous reste ${fmt(owed(c))} au total. Merci de payer par Wave ou Orange Money au ${V.payFmt} ou de passer faire un versement. PayLittle`;

async function rappels(){const L=(await store.all()).filter(c=>echu(c)>0).sort((a,b)=>echu(b)-echu(a));S.rl=L;app.innerHTML=`<header><button class="l" onclick="home()">‹</button><h1>Rappels du jour</h1><span></span></header><div class="pad">${L.length?L.map((c,i)=>`<div class="card"><div class="row"><b>${esc(c.nom)}</b><b class="red">${fmt(echu(c))}</b></div><small>${c.phone}</small>${c.credits.some(late)?'<em>En retard</em>':''}<div class="row"><button class="b s" onclick="relance(${i},'w')">WhatsApp</button><button class="b s" onclick="relance(${i},'s')">SMS</button></div></div>`).join(''):'<p class="mut">Personne à relancer aujourd\'hui.</p>'}</div>`}

function relance(i,k){const c=S.rl[i],t=encodeURIComponent(txt(c));if(k=='w')open('https://wa.me/'+nn(c.phone)+'?text='+t);else location.href='sms:+'+nn(c.phone)+'?body='+t}

async function arts(){const L=await store.arts();app.innerHTML=`<header><button class="l" onclick="home()">‹</button><h1>Mes articles</h1><span></span></header><div class="pad"><div class="card"><input id="an" placeholder="Nom de l'article"><select id="ac2">${CATS.map(k=>`<option>${k}</option>`).join('')}</select><input id="ap" type="number" placeholder="Prix (F)"><label>Photo (facultatif)</label><input id="af" type="file" accept="image/*"><button class="b" onclick="addArt()">Ajouter l'article</button></div>${L.length?L.map(a=>`<div class="card"><div class="row" style="align-items:center">${a.img?`<img src="${a.img}" class="th" alt="">`:''}<div style="flex:1"><b>${esc(a.nom)}</b><small>${esc(a.cat)}, ${fmt(a.prix)}</small></div><button class="l red" onclick="delArt('${a.id}')">Retirer</button></div></div>`).join(''):'<p class="mut">Ajoutez vos articles : ils défileront chez vos clients.</p>'}</div>`}

function shrink(f,m=320,q=.7){return new Promise(r=>{if(!f)return r('');const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',q))};i.onerror=()=>r('');i.src=u})}

async function addArt(){const n=$('#an').value.trim(),p=+$('#ap').value;if(!n||!(p>0))return alert('Entrez le nom et le prix.');await store.addArt({id:String(Date.now()),nom:n,cat:$('#ac2').value,prix:p,img:await shrink($('#af').files[0]),date:today()});arts()}

async function delArt(id){if(confirm('Retirer cet article ?')){await store.delArt(id);arts()}}

auto();
</script></body></html>
