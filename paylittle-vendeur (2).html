<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D4ED8"><title>PayLittle Vendeur</title>
<style>
*{box-sizing:border-box;margin:0}
body{font:16px system-ui,sans-serif;background:#F1F5F9;color:#0F172A;padding-bottom:90px}
.hero{min-height:100vh;background:#1D4ED8;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.hero .b{max-width:320px;background:#fff;color:#1D4ED8}
.hero .b.o{background:transparent;color:#fff;border:2px solid #fff}
header{background:#1D4ED8;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
header small{color:#BFDBFE}
.pad{padding:16px}h1{font-size:22px}h2{margin:12px 0}
input,select{width:100%;padding:13px;margin:6px 0;border:1px solid #CBD5E1;border-radius:10px;font-size:16px;background:#fff}
label{font-size:14px;color:#64748B}
.b{display:block;width:100%;padding:14px;margin:10px 0;border:0;border-radius:12px;background:#1D4ED8;color:#fff;font-size:16px;font-weight:600}
.b.o{background:#fff;color:#1D4ED8;border:2px solid #1D4ED8}
.b.s{padding:10px;background:#64748B}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.15);display:grid;gap:6px}
.card.late{border-left:5px solid #DC2626}
.row{display:flex;justify-content:space-between;gap:8px}
.red{color:#DC2626}.ok{color:#16A34A}
.bar{height:10px;background:#E2E8F0;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#1D4ED8}
small{color:#64748B;display:block}
em{color:#DC2626;font-style:normal;font-size:14px;font-weight:600}
.mut{color:#64748B;text-align:center;margin-top:40px}
.l{background:none;border:0;color:inherit;font-size:18px;padding:4px 8px}
.pad .l{color:#1D4ED8}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:16px;right:16px;padding:16px;border:0;border-radius:30px;background:#1D4ED8;color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid #CBD5E1;background:#fff;font-size:15px;color:#0F172A}.chip.on{background:#1D4ED8;color:#fff;border-color:#1D4ED8}
.th{width:56px;height:56px;object-fit:cover;border-radius:10px}
#res:empty{display:none}
.pc{width:92px;height:92px;object-fit:cover;border-radius:10px}
</style></head><body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CFG=null;
const PIN="1234";
const CATS=["Téléphone","Électroménager","Mobilier","Santé","Autre"];
let db=null;
try{if(CFG){firebase.initializeApp(CFG);db=firebase.firestore();}}catch(e){}
const store={
 async setPcs(ph,o){if(db){await db.collection('pieces').doc(ph).set(o);return;}const m=JSON.parse(localStorage.getItem('plp')||'{}');m[ph]=o;localStorage.setItem('plp',JSON.stringify(m));},
 async getPcs(ph){if(db){const d=await db.collection('pieces').doc(ph).get();return d.exists?d.data():null;}return(JSON.parse(localStorage.getItem('plp')||'{}'))[ph]||null;},
 async arts(){if(db){const s=await db.collection('articles').get();return s.docs.map(d=>d.data());}return JSON.parse(localStorage.getItem('pla')||'[]');},
 async addArt(a){if(db){await db.collection('articles').doc(a.id).set(a);return;}const l=await this.arts();l.push(a);localStorage.setItem('pla',JSON.stringify(l));},
 async delArt(id){if(db){await db.collection('articles').doc(id).delete();return;}localStorage.setItem('pla',JSON.stringify((await this.arts()).filter(x=>x.id!==id)));},
 async all(){if(db){const s=await db.collection('clients').get();return s.docs.map(d=>d.data());}return JSON.parse(localStorage.getItem('pl')||'[]');},
 async get(p){if(db){const d=await db.collection('clients').doc(p).get();return d.exists?d.data():null;}return(await this.all()).find(c=>c.phone===p)||null;},
 async save(c){if(db){await db.collection('clients').doc(c.phone).set(c);return;}const a=await this.all();const i=a.findIndex(x=>x.phone===c.phone);i<0?a.push(c):a[i]=c;localStorage.setItem('pl',JSON.stringify(a));}
};
const $=s=>document.querySelector(s),app=$('#app');
const fmt=n=>Number(n).toLocaleString('fr-FR')+' F';
const num=s=>s.replace(/\D/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const dfr=d=>d.split('-').reverse().join('/');
const paid=cr=>cr.acompte+cr.versements.reduce((s,v)=>s+v.montant,0);
const LIB={j:'jour',s:'semaine',m:'mois'},STEP={j:1,s:7,m:30};
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const nextDue=cr=>{if(!cr.plan)return cr.echeance;const k=Math.min(Math.floor((paid(cr)-cr.acompte)/cr.plan.montant)+1,cr.plan.n);return addDays(cr.date,k*STEP[cr.plan.freq])};
const late=cr=>cr.prix-paid(cr)>0&&nextDue(cr)&&nextDue(cr)<today();
const dueNow=cr=>{if(!cr.plan)return cr.echeance&&cr.echeance<today()?Math.max(0,cr.prix-paid(cr)):0;const d=Math.floor((Date.parse(today())-Date.parse(cr.date))/864e5),k=Math.min(Math.max(Math.floor(d/STEP[cr.plan.freq]),0),cr.plan.n);return Math.max(0,Math.min(cr.prix,cr.acompte+k*cr.plan.montant)-paid(cr))};
const owed=c=>c.credits.reduce((s,x)=>s+x.prix-paid(x),0);
let S={sel:null,client:null};

function logo(s){return `<svg width="${s}" height="${s}" viewBox="0 0 160 160" role="img" aria-label="PayLittle"><rect width="160" height="160" rx="36" fill="#fff"/><path d="M0 116h160v8a36 36 0 0 1-36 36H36a36 36 0 0 1-36-36z" fill="#1D4ED8"/><circle cx="80" cy="58" r="38" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="6"/><path d="M80 58V20a38 38 0 0 1 38 38z" fill="#1D4ED8"/><path d="M80 58h38a38 38 0 0 1-38 38z" fill="#60A5FA"/><text x="80" y="147" text-anchor="middle" font-size="19" font-weight="600" fill="#fff" font-family="system-ui,sans-serif">PayLittle</text></svg>`}

function login(){app.innerHTML=`<div class="hero">${logo(120)}<p>Espace vendeur</p><button class="b" onclick="sellerLogin()">Entrer</button></div>`}
function sellerLogin(){if(prompt('Code vendeur')===PIN)home();else alert('Code incorrect')}

function cardCr(cr,i,v){const p=paid(cr),l=cr.prix-p,pc=Math.min(100,Math.round(p/cr.prix*100));
return `<div class="card ${late(cr)?'late':''}"><div class="row"><b>${esc(cr.article)}</b><b>${fmt(cr.prix)}</b></div>${cr.cat?`<small>${esc(cr.cat)}</small>`:''}<div class="bar"><i style="width:${pc}%"></i></div><div class="row"><span>Payé ${fmt(p)}</span><b class="${l>0?'red':'ok'}">${l>0?'Reste '+fmt(l):'Soldé'}</b></div>${l>0&&cr.plan?`<small>À payer : ${fmt(cr.plan.montant)} par ${LIB[cr.plan.freq]}. Prochain versement avant le ${dfr(nextDue(cr))}.</small>`:''}${cr.echeance&&l>0?`<small>Date limite : ${dfr(cr.echeance)}</small>`:''}${dueNow(cr)>0&&l>0?`<em>${late(cr)?'En retard : ':'À payer maintenant : '}${fmt(dueNow(cr))}</em>`:''}<details><summary>Historique (${cr.versements.length+1})</summary><small>${dfr(cr.date)} : acompte ${fmt(cr.acompte)}</small>${cr.versements.map(x=>`<small>${dfr(x.date)} : ${fmt(x.montant)}</small>`).join('')}</details>${v&&l>0?`<button class="b s" onclick="pay(${i})">Ajouter un versement</button>`:''}</div>`}

let F='Tous';
function setF(f){F=f;home()}
async function home(){const ow=c=>c.credits.filter(x=>F=='Tous'||x.cat==F).reduce((s,x)=>s+x.prix-paid(x),0);
const all=await store.all(),E=all.filter(c=>echu(c)>0),L=all.filter(c=>F=='Tous'||c.credits.some(x=>x.cat==F)).sort((a,b)=>ow(b)-ow(a));
app.innerHTML=`<header><b style="font-size:20px">PayLittle</b><div style="text-align:right"><small>Total dû</small><h1>${fmt(L.reduce((s,c)=>s+ow(c),0))}</h1></div></header><div class="pad"><div class="chips">${['Tous',...CATS].map(k=>`<button class="chip ${k==F?'on':''}" onclick="setF('${k}')">${k}</button>`).join('')}</div>${E.length?`<div class="card late" onclick="rappels()"><div class="row"><b>${E.length} client${E.length>1?'s':''} à relancer</b><b class="red">${fmt(E.reduce((s,c)=>s+echu(c),0))}</b></div><small>Appuyez pour envoyer les rappels</small></div>`:''}${L.length?L.map(c=>`<div class="card" onclick="open_('${c.phone}')"><div class="row"><b>${esc(c.nom)}</b><b class="${ow(c)?'red':'ok'}">${ow(c)?fmt(ow(c)):'Soldé'}</b></div><small>${c.phone}</small>${c.credits.some(late)?'<em>En retard</em>':''}</div>`).join(''):'<p class="mut">Aucun crédit ici pour l\'instant. Appuyez sur « Nouveau crédit ».</p>'}<button class="b o" onclick="arts()">Mes articles</button><button class="b o" onclick="login()">Quitter</button></div><button class="fab" onclick="newCr()">Nouveau crédit</button>`}

function voir(u){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9';d.innerHTML='<img src="'+u+'" style="max-width:100%;max-height:100%">';d.onclick=()=>d.remove();document.body.appendChild(d)}

async function open_(p){const c=S.sel=await store.get(p),pc=await store.getPcs(p),PH=pc?`<div class="card"><b>Pièces du client</b><div class="row">${[['photo','Photo'],['recto','Recto'],['verso','Verso']].map(([k,l])=>pc[k]?`<div><img src="${pc[k]}" class="pc" onclick="voir(this.src)" alt="${l}"><small>${l}</small></div>`:'').join('')}</div></div>`:'';app.innerHTML=`<header><button class="l" onclick="home()">‹</button><div style="flex:1"><h1>${esc(c.nom)}</h1><small>${c.phone}, code client : ${c.code}</small></div></header><div class="pad">${PH}${c.credits.map((x,i)=>cardCr(x,i,true)).join('')}<button class="b o" onclick="wa()">Envoyer un rappel WhatsApp</button><button class="b" onclick="newCr('${c.phone}')">Nouvel article à crédit</button></div>`}

async function pay(i){const cp=S.sel.credits[i],m=+prompt('Montant versé (F)',cp.plan?cp.plan.montant:'');if(!(m>0))return;const c=S.sel;c.credits[i].versements.push({montant:m,date:today()});await store.save(c);open_(c.phone)}

function wa(){const c=S.sel;let n=c.phone;if(n.length==10)n='225'+n;open('https://wa.me/'+n+'?text='+encodeURIComponent(`Bonjour ${c.nom}, il vous reste ${fmt(owed(c))} à payer pour vos articles. Merci de passer faire un versement. PayLittle`))}

const ACOMPTE=30;
const sugg=pr=>Math.ceil(pr*ACOMPTE/100/500)*500;
let ARTS=[];
async function newCr(p=''){ARTS=await store.arts();const c=p&&S.sel;app.innerHTML=`<div class="pad"><button class="l" onclick="${p?`open_('${p}')`:'home()'}">‹ Retour</button><h2>Nouveau crédit</h2><input id="n" placeholder="Nom du client" value="${c?esc(c.nom):''}"><input id="t" type="tel" placeholder="Téléphone du client" value="${p}" ${p?'readonly':''}>${p?'':'<label>Photo du client (obligatoire pour un nouveau client)</label><input id="fph" type="file" accept="image/*" capture="user"><label>Pièce d\'identité, recto</label><input id="frc" type="file" accept="image/*" capture="environment"><label>Pièce d\'identité, verso</label><input id="fvs" type="file" accept="image/*" capture="environment">'}<label>Catégorie</label><select id="cat">${CATS.map(k=>`<option>${k}</option>`).join('')}</select><select id="pick" onchange="pickArt()"><option value="">Choisir dans mes articles</option>${ARTS.map((a,i)=>`<option value="${i}">${esc(a.nom)} - ${fmt(a.prix)}</option>`).join('')}</select><input id="a" placeholder="Article (ex. Tecno Pop 10)"><input id="pr" type="number" inputmode="numeric" placeholder="Prix total (F)" oninput="calc('pr')"><label>Premier versement (conseillé : ${ACOMPTE} % du prix)</label><input id="ac" type="number" inputmode="numeric" placeholder="Premier versement (F)" oninput="calc()"><label>Durée</label><select id="du" onchange="calc()"><option value="1">1 mois</option><option value="2">2 mois</option><option value="3" selected>3 mois</option><option value="4">4 mois</option></select><label>Le client paie</label><select id="fr" onchange="calc()"><option value="j">Chaque jour</option><option value="s" selected>Chaque semaine</option><option value="m">Chaque mois</option></select><div class="card" id="res"></div><button class="b" onclick="saveCr()">Enregistrer le crédit</button></div>`}

function planOf(pr,ac,du,fr){const reste=pr-ac,n=fr=='m'?du:fr=='s'?Math.ceil(du*30/7):du*30;return{n,reste,montant:Math.ceil(reste/n/25)*25}}

function calc(src){const pr=+$('#pr').value||0;if(src=='pr'||src=='pick')$('#ac').value=pr?sugg(pr):'';const ac=+$('#ac').value||0,r=$('#res');if(!(pr>0)||ac>=pr){r.innerHTML='';return}const du=+$('#du').value,fr=$('#fr').value,P=planOf(pr,ac,du,fr);r.innerHTML=`<div class="row"><span>Reste à payer</span><b>${fmt(P.reste)}</b></div><div class="row"><span>Chaque ${LIB[fr]}</span><b>${fmt(P.montant)}</b></div><small>${P.n} versements. Fin le ${dfr(addDays(today(),du*30))}.</small>`}

function pickArt(){const a=ARTS[$('#pick').value];if(!a)return;$('#a').value=a.nom;$('#pr').value=a.prix;$('#cat').value=a.cat;calc('pick')}

async function saveCr(){const g=i=>$('#'+i).value.trim(),ph=num(g('t')),pr=+g('pr'),ac=+g('ac')||0;
if(!g('n')||ph.length<8||!g('a')||!(pr>0)||ac>pr)return alert('Vérifiez le nom, le téléphone, l\'article, le prix et le premier versement.');
const old=await store.get(ph),F=['fph','frc','fvs'].map(i=>$('#'+i)&&$('#'+i).files[0]);
if(!old&&F.some(x=>!x))return alert('Prenez la photo du client et sa pièce d\'identité, recto et verso.');
if(F.some(x=>x)){try{const o=await store.getPcs(ph)||{};const R=await Promise.all(F.map((x,i)=>x?shrink(x,i?1000:500,.65):''));await store.setPcs(ph,{photo:R[0]||o.photo||'',recto:R[1]||o.recto||'',verso:R[2]||o.verso||''})}catch(e){return alert('Les photos n\'ont pas pu être enregistrées. Réessayez.')}}
const c=old||{nom:g('n'),phone:ph,code:String(1000+Math.floor(Math.random()*9000)),credits:[]};
const du=+g('du'),fr=g('fr'),cr={article:g('a'),cat:g('cat'),prix:pr,acompte:ac,date:today(),echeance:'',versements:[]};
if(ac<pr){const P=planOf(pr,ac,du,fr);cr.plan={freq:fr,n:P.n,montant:P.montant};cr.echeance=addDays(cr.date,du*30)}
c.credits.push(cr);await store.save(c);S.sel=c;alert('Crédit enregistré. Code du client : '+c.code);open_(ph)}

const nn=ph=>ph.length==10?'225'+ph:ph;
const echu=c=>c.credits.reduce((s,x)=>s+dueNow(x),0);
const txt=c=>`Bonjour ${c.nom}, votre versement de ${fmt(echu(c))} est arrivé à échéance. Il vous reste ${fmt(owed(c))} au total. Merci de passer faire un versement. PayLittle`;

async function rappels(){const L=(await store.all()).filter(c=>echu(c)>0).sort((a,b)=>echu(b)-echu(a));S.rl=L;app.innerHTML=`<header><button class="l" onclick="home()">‹</button><h1>Rappels du jour</h1><span></span></header><div class="pad">${L.length?L.map((c,i)=>`<div class="card"><div class="row"><b>${esc(c.nom)}</b><b class="red">${fmt(echu(c))}</b></div><small>${c.phone}</small>${c.credits.some(late)?'<em>En retard</em>':''}<div class="row"><button class="b s" onclick="relance(${i},'w')">WhatsApp</button><button class="b s" onclick="relance(${i},'s')">SMS</button></div></div>`).join(''):'<p class="mut">Personne à relancer aujourd\'hui.</p>'}</div>`}

function relance(i,k){const c=S.rl[i],t=encodeURIComponent(txt(c));if(k=='w')open('https://wa.me/'+nn(c.phone)+'?text='+t);else location.href='sms:+'+nn(c.phone)+'?body='+t}

async function arts(){const L=await store.arts();app.innerHTML=`<header><button class="l" onclick="home()">‹</button><h1>Mes articles</h1><span></span></header><div class="pad"><div class="card"><input id="an" placeholder="Nom de l'article"><select id="ac2">${CATS.map(k=>`<option>${k}</option>`).join('')}</select><input id="ap" type="number" placeholder="Prix (F)"><label>Photo (facultatif)</label><input id="af" type="file" accept="image/*"><button class="b" onclick="addArt()">Ajouter l'article</button></div>${L.length?L.map(a=>`<div class="card"><div class="row" style="align-items:center">${a.img?`<img src="${a.img}" class="th" alt="">`:''}<div style="flex:1"><b>${esc(a.nom)}</b><small>${esc(a.cat)}, ${fmt(a.prix)}</small></div><button class="l red" onclick="delArt('${a.id}')">Retirer</button></div></div>`).join(''):'<p class="mut">Ajoutez vos articles : ils défileront chez vos clients.</p>'}</div>`}

function shrink(f,m=320,q=.7){return new Promise(r=>{if(!f)return r('');const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',q))};i.onerror=()=>r('');i.src=u})}

async function addArt(){const n=$('#an').value.trim(),p=+$('#ap').value;if(!n||!(p>0))return alert('Entrez le nom et le prix.');await store.addArt({id:String(Date.now()),nom:n,cat:$('#ac2').value,prix:p,img:await shrink($('#af').files[0]),date:today()});arts()}

async function delArt(id){if(confirm('Retirer cet article ?')){await store.delArt(id);arts()}}

login();
</script></body></html>
